name: Supabase Database CI

on:
  push:
    branches: [codex/admin-supabase]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-database:
    name: Migrations, RLS, types, and application
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and initial seed
        run: supabase db reset --local

      - name: Show applied migration order
        run: supabase migration list --local

      - name: Apply seed a second time
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/seed.sql

      - name: Run pgTAP database tests
        run: supabase test db --local supabase/tests

      - name: Lint PostgreSQL schema
        run: supabase db lint --local --level error --fail-on error

      - name: Generate database types
        run: |
          mkdir -p artifacts
          supabase gen types typescript --local --schema public > artifacts/database.types.ts

      - name: Upload generated database types
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-types
          path: artifacts/database.types.ts
          if-no-files-found: error

      - name: Verify committed database types
        run: diff --unified src/lib/supabase/database.types.ts artifacts/database.types.ts

      - name: Lint application
        run: pnpm lint

      - name: Typecheck application
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
