name: Supabase Database CI

on:
  push:
    branches: [codex/admin-supabase, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-database:
    name: Migrations, RLS, types, and application
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Activate exact pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate
          test "$(pnpm --version)" = "10.34.6"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify generated seed is current
        run: |
          pnpm seed:supabase
          git diff --exit-code -- supabase/seed.sql

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and initial seed
        run: supabase db reset --local

      - name: Show applied migration order
        run: supabase migration list --local

      - name: Apply seed a second time
        run: psql "postgresql://postgres:postgres@127.0.0.1:54422/postgres" --set ON_ERROR_STOP=1 --file supabase/seed.sql

      - name: Run pgTAP database tests
        run: supabase test db --local supabase/tests

      - name: Verify populated catalogue upgrade and replay
        run: pnpm db:test:upgrades

      - name: Lint PostgreSQL schema
        run: supabase db lint --local --level error --fail-on error

      - name: Generate database types
        run: |
          mkdir -p artifacts
          supabase gen types typescript --local --schema public,management_api | sed '${/^$/d;}' > artifacts/database.types.ts

      - name: Upload generated database types
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-types
          path: artifacts/database.types.ts
          if-no-files-found: error

      - name: Verify committed database types
        run: diff --unified packages/data-contract/src/database.types.ts artifacts/database.types.ts

      - name: Run unit tests
        run: pnpm test

      # Exported before the empty reset because the public Supabase gate below needs the
      # seeded database. The keys are stack-wide and survive a reset, so the later gates
      # keep working from the same values.
      - name: Export local Supabase browser environment
        shell: bash
        run: |
          status_json="$(supabase status -o json)"
          api_url="$(jq -r '.API_URL // empty' <<<"$status_json")"
          anon_key="$(jq -r '.ANON_KEY // empty' <<<"$status_json")"
          secret_key="$(jq -r '.SERVICE_ROLE_KEY // empty' <<<"$status_json")"
          test -n "$api_url" && test -n "$anon_key" && test -n "$secret_key"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$api_url" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$anon_key" >> "$GITHUB_ENV"
          printf 'SUPABASE_SECRET_KEY=%s\n' "$secret_key" >> "$GITHUB_ENV"

      - name: Install Chromium for the browser gates
        run: pnpm exec playwright install --with-deps chromium

      # Runs while the database still holds the seed: the anonymous storefront is served
      # by the real provider and must show the seeded catalogue. This is the gate the
      # mock one cannot be — it is what catches a privilege or RLS regression.
      - name: Run public Supabase gate
        run: pnpm exec playwright test --config playwright.supabase-public.config.ts

      - name: Reset empty database for admin browser tests
        run: supabase db reset --local --no-seed

      - name: Run admin browser gate
        run: pnpm exec playwright test --config playwright.admin.config.ts

      - name: Run storefront order gate
        run: pnpm exec playwright test --config playwright.storefront.config.ts

      - name: Run public browser gate
        env:
          COMMERCE_PROVIDER: mock
          CONTENT_PROVIDER: mock
        run: pnpm exec playwright test --config playwright.config.ts

      - name: Lint application
        run: pnpm lint

      - name: Check workspace boundaries
        run: pnpm check:workspace-boundaries

      - name: Typecheck and build storefront
        run: |
          pnpm typecheck:storefront
          pnpm build:storefront

      - name: Typecheck and build management using a fictitious remote target
        env:
          NEXT_PUBLIC_APP_SURFACE: management
          NEXT_PUBLIC_SUPABASE_URL: https://ci-management.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          NEXT_PUBLIC_EXPECTED_SUPABASE_PROJECT_REF: ci-management
          MANAGEMENT_ORIGIN: https://management-ci.invalid
          STOREFRONT_ORIGIN: https://storefront-ci.invalid
          MANAGEMENT_MODE: read_only
          SUPABASE_SECRET_KEY: ""
        run: |
          pnpm typecheck:management
          pnpm build:management

      - name: Verify manifests and bidirectional build independence
        run: |
          pnpm verify:management-manifest
          pnpm verify:manifest-isolation
          pnpm verify:build-independence

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
