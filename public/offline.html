<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Gestionale offline</title>
  <style>
    :root { color-scheme: light; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f4f5f7; color: #17191d; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 440px; margin: 24px; border: 1px solid #e0e2e6; border-radius: 20px; padding: 28px; background: #fff; }
    p.eyebrow { margin: 0 0 8px; color: #7a3cff; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: -.02em; }
    p { margin: 0 0 18px; color: #555a62; }
    button { min-height: 44px; border: 0; border-radius: 10px; padding: 0 18px; background: #7a3cff; color: #fff; cursor: pointer; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Gestionale</p>
    <h1>Sei offline</h1>
    <p>Il gestionale lavora sui dati condivisi con i soci: serve la connessione per leggerli e salvarli. Niente è andato perso.</p>
    <button onclick="location.reload()" type="button">Riprova</button>
  </main>
</body>
</html>
